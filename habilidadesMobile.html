
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Efecto CRT -->
    <link rel="stylesheet" href="CRT/crt-overlay.css">
    <script src="CRT/crt-overlay.js" defer></script>

    <title>Gy Arts - HDMI 1 (Wii Menu - Habilidades)</title>

    <style>
        /* =========================================
           DECLARACIÓN DE FUENTES
           ========================================= */

        @font-face {
            font-family: 'Chunko';
            src: url('fonts/Chunko Bold Demo.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Teko';
            src: url('fonts/Teko-Regular.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #F6FFE9;
            font-family: 'Teko', sans-serif;
            font-size: 1.3rem;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================================
           CONTENEDOR TELEVISOR
           ========================================= */

        .tv-screen-container {
            width: 1366px;
            height: 768px;
            background-color: #CAC5E5;
            border: 12px solid #F137A6;
            padding: 20px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.6);
            outline: 6px solid #F2E0A4;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: absolute;
            transform-origin: center center;
        }

        /* =========================================
           BOTÓN REGRESAR
           ========================================= */

        .btn-regresar-home {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 45px;
            height: 40px;
            background: rgba(41, 0, 135, 0.5);
            border: 2px solid #F2E0A4;
            border-radius: 8px;
            color: #F6FFE9;
            font-size: 1.6rem;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 60;
            cursor: pointer;
            line-height: 1;
        }

        .btn-regresar-home:hover {
            opacity: 0.9 !important;
            transform: scale(1.1);
            background-color: #F137A6;
            color: #F6FFE9;
        }

        /* =========================================
           ENCABEZADO OSD ESTILO WII
           ========================================= */

        .wii-header {
            background-color: #290087;
            border: 3px solid #F2E0A4;
            border-radius: 10px;
            padding: 10px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #F6FFE9;
            margin-bottom: 10px;
        }

        .wii-title {
            font-family: 'Chunko', sans-serif;
            font-size: 2rem;
            color: #F2E0A4;
        }

        .wii-time {
            font-size: 1.8rem;
            color: #F6FFE9;
        }

        /* =========================================
           ÁREA PRINCIPAL
           ========================================= */

        .wii-main-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 50px;
            overflow: hidden;
        }

        /* =========================================
           FLECHAS DE NAVEGACIÓN
           ========================================= */

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 38px !important;
            height: 38px !important;
            cursor: pointer;
            opacity: 0.75;
            filter: drop-shadow(0px 2px 4px rgba(41, 0, 135, 0.7));
            transition: opacity 0.2s ease, transform 0.2s ease, filter 0.2s ease;
            z-index: 60;
            user-select: none;
        }

        .nav-arrow:hover {
            opacity: 1 !important;
            transform: translateY(-50%) scale(1.25);
            filter: drop-shadow(0 0 10px #F137A6);
        }

        .arrow-left {
            left: 8px;
        }

        .arrow-right {
            right: 8px;
        }

        /* =========================================
           PARRILLA DE CANALES (3x2 ESCRITORIO)
           ========================================= */

        .wii-grid-page {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
            align-items: center;
        }

        /* =========================================
           TARJETAS DE CANALES
           ========================================= */

        .wii-channel-card {
            background: #ffffff;
            border: 4px solid #290087;
            border-radius: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 18px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            padding: 0;
        }

        .wii-channel-card:hover {
            transform: scale(1.05);
            border-color: #F137A6;
            box-shadow: 0 0 25px #F137A6, 0 10px 20px rgba(0,0,0,0.3);
        }

        /* =========================================
           LOGOS DE SOFTWARE
           ========================================= */

        .channel-logo-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .channel-logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .wii-channel-card:hover .channel-logo-img {
            transform: scale(1.08);
        }

        /* =========================================
           ETIQUETAS DE LOS CANALES
           ========================================= */

        .channel-name-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(41, 0, 135, 0.85);
            color: #F6FFE9;
            font-family: 'Chunko', sans-serif;
            font-size: 1.4rem;
            text-align: center;
            padding: 4px 0;
            border-top: 2px solid #F2E0A4;
            transition: background 0.2s ease;
        }

        .wii-channel-card:hover .channel-name-overlay {
            background: rgba(241, 55, 166, 0.95);
            color: #F6FFE9;
        }

        /* =========================================
           BARRA INFERIOR ESTILO WII
           ========================================= */

        .wii-bottom-panel {
            background-color: #290087;
            border: 3px solid #F2E0A4;
            border-radius: 10px;
            padding: 10px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
        }

        .wii-btn-round {
            width: 50px;
            height: 50px;
            background-color: #CAC5E5;
            border: 3px solid #F2E0A4;
            border-radius: 50%;
            color: #290087;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .wii-btn-round:hover {
            background-color: #F137A6;
            color: #F6FFE9;
            transform: scale(1.1);
        }

        /* =========================================
           ADAPTACIÓN PARA TELÉFONOS VERTICALES
           ========================================= */

        @media screen and (max-width: 600px) and (orientation: portrait) {

            html, body {
                width: 100%;
                height: 100%;
                min-height: 100%;
                overflow: hidden;
            }

            body {
                font-size: 1rem;
                padding: 8px;
            }

            .tv-screen-container {
                position: relative;
                width: 100%;
                height: 100%;
                min-width: 0;
                min-height: 0;
                padding: 9px;
                border-width: 7px;
                outline-width: 3px;
                box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
                transform: none !important;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                gap: 8px;
            }

            .btn-regresar-home {
                top: 12px;
                right: 12px;
                width: 30px;
                height: 29px;
                font-size: 1.1rem;
                border-radius: 6px;
                opacity: 0.85;
            }

            .wii-header {
                flex-shrink: 0;
                min-height: 48px;
                margin: 0;
                padding: 7px 42px 7px 10px;
                border-width: 2px;
                border-radius: 8px;
                gap: 5px;
            }

            .wii-title {
                font-size: clamp(0.75rem, 3.5vw, 1.1rem);
                line-height: 1.1;
            }

            .wii-time {
                font-size: clamp(0.8rem, 3.5vw, 1.1rem);
                white-space: nowrap;
            }

            .wii-main-area {
                flex: 1;
                min-height: 0;
                width: 100%;
                padding: 8px 27px;
                overflow: hidden;
            }

            .wii-grid-page {
                width: 100%;
                height: 100%;
                min-height: 0;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-rows: repeat(3, minmax(0, 1fr));
                gap: 9px;
                align-items: stretch;
            }

            .wii-channel-card {
                min-width: 0;
                min-height: 0;
                border-width: 2px;
                border-radius: 11px;
                box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            }

            .channel-logo-container {
                width: 100%;
                height: 100%;
            }

            .channel-logo-img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .channel-name-overlay {
                font-size: clamp(0.65rem, 2.8vw, 0.9rem);
                line-height: 1.1;
                padding: 4px 2px;
                border-top-width: 1px;
            }

            .nav-arrow {
                width: 25px !important;
                height: 25px !important;
                opacity: 0.9;
            }

            .arrow-left {
                left: 0;
            }

            .arrow-right {
                right: 0;
            }

            .wii-bottom-panel {
                flex-shrink: 0;
                height: 51px;
                min-height: 51px;
                padding: 5px 9px;
                border-width: 2px;
                border-radius: 8px;
                gap: 5px;
            }

            .wii-btn-round {
                width: 34px;
                height: 34px;
                min-width: 34px;
                border-width: 2px;
                font-size: 1rem;
            }

            .wii-bottom-panel > span {
                font-size: 0.9rem !important;
                white-space: nowrap;
            }

            .wii-bottom-panel > div {
                gap: 5px !important;
            }
        }

        /* =========================================
           ADAPTACIÓN PARA TELÉFONOS HORIZONTALES
           ========================================= */

        @media screen and (max-width: 900px) and (orientation: landscape) {

            html, body {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            body {
                padding: 7px;
            }

            .tv-screen-container {
                position: relative;
                width: 100%;
                height: 100%;
                min-width: 0;
                min-height: 0;
                padding: 8px;
                border-width: 7px;
                outline-width: 3px;
                transform: none !important;
                gap: 6px;
            }

            .btn-regresar-home {
                top: 8px;
                right: 10px;
                width: 29px;
                height: 27px;
                font-size: 1rem;
            }

            .wii-header {
                flex-shrink: 0;
                min-height: 38px;
                margin: 0;
                padding: 4px 42px 4px 10px;
            }

            .wii-title {
                font-size: 1.1rem;
            }

            .wii-time {
                font-size: 1rem;
            }

            .wii-main-area {
                flex: 1;
                min-height: 0;
                padding: 5px 35px;
            }

            .wii-grid-page {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                grid-template-rows: repeat(2, minmax(0, 1fr));
                gap: 7px;
            }

            .wii-channel-card {
                min-height: 0;
                border-width: 2px;
                border-radius: 10px;
            }

            .channel-name-overlay {
                font-size: 0.85rem;
                padding: 2px;
            }

            .nav-arrow {
                width: 26px !important;
                height: 26px !important;
            }

            .wii-bottom-panel {
                flex-shrink: 0;
                height: 42px;
                min-height: 42px;
                padding: 3px 9px;
            }

            .wii-btn-round {
                width: 30px;
                height: 30px;
                min-width: 30px;
                font-size: 0.9rem;
            }

            .wii-bottom-panel > span {
                font-size: 0.9rem !important;
            }
        }

    </style>
</head>

<body>

    <div class="tv-screen-container">

        <!-- BOTÓN REGRESAR AL CANAL -->
        <a href="guiaCanalesMobile.html"
           class="btn-regresar-home"
           title="Volver al Canal">↩</a>

        <!-- ENCABEZADO OSD -->

            <div class="wii-time" id="clock">12:00 PM</div>
        </header>

        <!-- ÁREA PRINCIPAL CON FLECHAS Y PARRILLA -->
        <div class="wii-main-area">

            <img src="img/felcha izq.png"
                 alt="Anterior"
                 class="nav-arrow arrow-left"

            <!-- =====================================

                 ===================================== -->

                </div>

                <!-- ZBrush -->

                <!-- Unity -->
                <div class="wii-channel-card">

                    <div class="channel-name-overlay">AFTER EFFECTS</div>

                <div class="wii-channel-card">

                <!-- Autodesk Maya -->
                <div class="wii-channel-card">

                        <img src="img/habilidades/AutoDeskMayaLOGO.png"

                <!-- Substance Painter -->

                <!-- DaVinci Resolve -->
                <div class="wii-channel-card">

        <!-- =====================================

            </span>

    <!-- =====================================
         SCRIPT DE RELOJ, PAGINACIÓN
         Y PRUEBA DE EXTENSIONES
         ===================================== -->

    <script>

        /* Reloj */
        function actualizarReloj() {
            const ahora = new Date();

            let horas = ahora.getHours();
            let minutos = ahora.getMinutes();

            const ampm = horas >= 12 ? 'PM' : 'AM';

            horas = horas % 12;
            horas = horas ? horas : 12;

            minutos = minutos < 10 ? '0' + minutos : minutos;

            document.getElementById('clock').innerText =
                horas + ':' + minutos + ' ' + ampm;
        }

        setInterval(actualizarReloj, 1000);
        actualizarReloj();


        /* Paginación */
        let paginaActual = 1;

        function cambiarPagina(direccion) {

            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const pageNum = document.getElementById('pageNum');

            if (direccion === 1 && paginaActual === 1) {

                paginaActual = 2;

                page1.style.display = 'none';
                page2.style.display = 'grid';

                pageNum.innerText = '2';

            } else if (direccion === -1 && paginaActual === 2) {

                paginaActual = 1;

                page2.style.display = 'none';
                page1.style.display = 'grid';

                pageNum.innerText = '1';
            }
        }


        /* Comprobar extensiones de imágenes */
        function probarJpg(imgElem, basePath) {

            if (!imgElem.dataset.intentos) {

                imgElem.dataset.intentos = "1";
                imgElem.src = basePath + ".jpg";

            } else if (imgElem.dataset.intentos === "1") {

                imgElem.dataset.intentos = "2";
                imgElem.src = basePath + ".jpeg";

            } else if (imgElem.dataset.intentos === "2") {

                imgElem.dataset.intentos = "3";
                imgElem.src = basePath + ".PNG";
            }
        }

    </script>

</body>
