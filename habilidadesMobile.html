<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="estilos-pantallas.css">
    <title>Gy Arts - Habilidades & Software (Móvil)</title>
    
    <style>
        /* Declaración de fuentes */
        @font-face {
            font-family: 'Chunko';
            src: url('fonts/Chunko Bold Demo.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Teko';
            src: url('fonts/Teko-Regular.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Estilos específicos adaptados a la distribución interna del grid de habilidades */
        .tv-screen-container {
            font-family: 'Teko', sans-serif;
            color: #F6FFE9;
            background-color: #CAC5E5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Cabecera estilo HDMI / Canal */
        .hdm-header {
            background-color: #290087;
            border: 2px solid #F2E0A4;
            border-radius: 4px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #F6FFE9;
            font-family: 'Chunko', sans-serif;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .hdm-title {
            color: #F2E0A4;
        }

        /* Grid de habilidades / software de 3 columnas x 2 filas */
        .habilidades-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
            margin: 12px 0;
            min-height: 0;
        }

        .habilidad-card {
            background-color: #1a084c;
            border: 3px solid #F137A6;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 6px;
        }

        .habilidad-card img, .habilidad-card video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Barra de navegación inferior de 3 botones */
        .bottom-nav-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            flex-shrink: 0;
        }

        .bottom-nav-btn {
            background-color: #CAC5E5;
            color: #290087;
            font-family: 'Chunko', sans-serif;
            font-size: 0.95rem;
            text-align: center;
            padding: 8px 4px;
            border-radius: 4px;
            border: 2px solid #F2E0A4;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .bottom-nav-btn:hover {
            background-color: #F137A6;
            color: #F6FFE9;
        }
    </style>
</head>

<body>
    <!-- Contenedor principal que el script global y el CSS escalan y posicionan -->
    <div class="tv-screen-container" id="tvContainer">
        
        <!-- Cabecera -->
        <div class="hdm-header">
            <div class="hdm-title">HDMI 1 - CANALES DE SOFTWARE</div>
            <div id="relojTv">12:05 AM</div>
        </div>

        <!-- Grid de Habilidades (6 tarjetas) -->
        <div class="habilidades-grid">
            <div class="habilidad-card">
                <img src="img/habilidades/krita.jpg" alt="Krita" onerror="this.src='img/natalie_bio.jpg'">
            </div>
            <div class="habilidad-card">
                <img src="img/habilidades/blender.jpg" alt="Blender" onerror="this.src='img/natalie_bio.jpg'">
            </div>
            <div class="habilidad-card">
                <img src="img/habilidades/zbrush.jpg" alt="ZBrush" onerror="this.src='img/natalie_bio.jpg'">
            </div>
            <div class="habilidad-card">
                <img src="img/habilidades/unity.jpg" alt="Unity" onerror="this.src='img/natalie_bio.jpg'">
            </div>
            <div class="habilidad-card">
                <img src="img/habilidades/aftereffects.jpg" alt="After Effects" onerror="this.src='img/natalie_bio.jpg'">
            </div>
            <div class="habilidad-card">
                <img src="img/habilidades/illustrator.jpg" alt="Illustrator" onerror="this.src='img/natalie_bio.jpg'">
            </div>
        </div>

        <!-- Botones de Navegación Inferiores -->
        <div class="bottom-nav-buttons">
            <a href="guiaCanalesMobile.html" class="bottom-nav-btn">GUÍA</a>
            <a href="index.html" class="bottom-nav-btn">INICIO</a>
            <a href="disenoMobile.html" class="bottom-nav-btn">INPUTS</a>
        </div>

    </div>

    <!-- Script de comprobación de imágenes alternativas -->
    <script>
        function probarJpg(imgElem, basePath) {
            if (!imgElem.dataset.intentos) {
                imgElem.dataset.intentos = "1";
                imgElem.src = basePath + ".jpeg";
            } else if (imgElem.dataset.intentos === "1") {
                imgElem.dataset.intentos = "2";
                imgElem.src = basePath + ".JPG";
            } else if (imgElem.dataset.intentos === "2") {
                imgElem.dataset.intentos = "3";
                imgElem.src = basePath + ".PNG";
            }
        }
    </script>

    <!-- Vinculación del script global de ajuste móvil existente -->
    <script src="ajuste-movil.js"></script>
</body>
</html>
