<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gy Arts - Canal de Software / Habilidades (Móvil)</title>

    <style>
        /* Declaración de fuentes */
        @font-face {
            font-family: 'Chunko';
            src: url('fonts/Chunko Bold Demo.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Teko';
            src: url('fonts/Teko-Regular.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background-color: #290087;
            color: #F6FFE9;
            font-family: 'Teko', sans-serif;
            font-size: 1.1rem;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* CONTENEDOR PRINCIPAL DEL TELEVISOR (Mismo estándar que tus otras páginas móviles) */
        .tv-screen-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #CAC5E5;
            border: 4px solid #F137A6;
            padding: 5px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            outline: 2px solid #F2E0A4;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* CABECERA ESTILO CANAL HDMI */
        .hdm-header {
            background-color: #290087;
            border: 2px solid #F2E0A4;
            border-radius: 4px;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #F6FFE9;
            font-family: 'Chunko', sans-serif;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .hdm-title {
            color: #F2E0A4;
        }

        /* ÁREA CENTRAL DE CANALES / HABILIDADES (Estilo menú Wii) */
        .habilidades-grid-area {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 6px;
            margin: 4px 0;
            min-height: 0;
        }

        .habilidad-card {
            background-color: #1a084c;
            border: 2px solid #F137A6;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 3px;
        }

        .habilidad-card img, 
        .habilidad-card video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #05020a;
        }

        /* BOTONES INFERIORES (Idénticos a disenoMobile.html) */
        .bottom-nav-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            flex-shrink: 0;
        }

        .bottom-nav-btn {
            background-color: #CAC5E5;
            color: #290087;
            font-family: 'Chunko', sans-serif;
            font-size: 0.7rem;
            text-align: center;
            padding: 4px 2px;
            border-radius: 4px;
            border: 1.5px solid #F2E0A4;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .bottom-nav-btn:hover {
            background-color: #F137A6;
            color: #F6FFE9;
        }
    </style>
</head>

<body>

    <div class="tv-screen-container" id="tvContainer">

        <!-- CABECERA DE CANAL -->
        <div class="hdm-header">
            <div class="hdm-title">HDMI 1 - CANALES DE SOFTWARE</div>
            <div id="relojTv">12:05 AM</div>
        </div>

        <!-- CUADRÍCULA DE HABILIDADES (Estilo Menú Wii) -->
        <div class="habilidades-grid-area">
            <div class="habilidad-card">
                <img src="img/habilidades/krita.jpg" alt="Krita" onerror="this.src='img/natalie_bio.jpg'">
            </div>
            <div class="habilidad-card">
                <img src="img/habilidades/blender.jpg" alt="Blender" onerror="this.src='img/natalie_bio.jpg'">
            </div>
            <div class="habilidad-card">
                <img src="img/habilidades/zbrush.jpg" alt="ZBrush" onerror="this.src='img/natalie_bio.jpg'">
            </div>
            <div class="habilidad-card">
                <img src="img/habilidades/unity.jpg" alt="Unity" onerror="this.src='img/natalie_bio.jpg'">
            </div>
            <div class="habilidad-card">
                <img src="img/habilidades/aftereffects.jpg" alt="After Effects" onerror="this.src='img/natalie_bio.jpg'">
            </div>
            <div class="habilidad-card">
                <img src="img/habilidades/illustrator.jpg" alt="Illustrator" onerror="this.src='img/natalie_bio.jpg'">
            </div>
        </div>

        <!-- BOTONES INFERIORES -->
        <div class="bottom-nav-buttons">
            <a href="guiaCanalesMobile.html" class="bottom-nav-btn">GUÍA</a>
            <a href="index.html" class="bottom-nav-btn">INICIO</a>
            <a href="disenoMobile.html" class="bottom-nav-btn">INPUTS</a>
        </div>

    </div>

    <!-- SCRIPT DE AJUSTE MÓVIL GLOBAL (Sin modificar, igual que tus otras páginas) -->
    <script src="ajuste-movil.js"></script>

</body>
</html>
