<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gy Arts - Guía EPG Poly-TV (Móvil)</title>
    
    <style>
        /* Declaración de Tus Fuentes Originales */
        @font-face {
            font-family: 'Chunko';
            src: url('fonts/Chunko Bold Demo.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Teko';
            src: url('fonts/Teko-Regular.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #F6FFE9;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Teko', sans-serif;
        }

        /* Contenedor principal que emula el televisor ajustado a la pantalla completa del móvil */
        .mobile-tv-container {
            width: 100vw;
            height: 100vh;
            background-color: #290087;
            border: 5px solid #F137A6;
            outline: 2px solid #F2E0A4;
            padding: 5px;
            display: flex;
            gap: 6px;
            box-sizing: border-box;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* COLUMNA IZQUIERDA: Video Preview (Arriba) + Tarjeta Info (Abajo) */
        .mobile-left-col {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            height: 100%;
            overflow: hidden;
        }

        /* Preview Video Estilo PC */
        .mobile-video-preview {
            flex: 1;
            background-color: #000;
            border: 2px solid #F2E0A4;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        .mobile-video-preview video,
        .mobile-video-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Botón regresar dentro del video */
        .btn-regresar-mobile {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            background: rgba(41, 0, 135, 0.7);
            border: 2px solid #F2E0A4;
            border-radius: 4px;
            color: #F6FFE9;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            z-index: 20;
            font-size: 0.75rem;
        }

        /* Tarjeta de Información Estilo Lavanda (Abajo a la izquierda) - Altura fija estricta para que no se salga */
        .mobile-info-card {
            height: 38px;
            flex-shrink: 0;
            background-color: #CAC5E5;
            border: 2px solid #F2E0A4;
            border-radius: 5px;
            padding: 2px 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .mobile-channel-tag {
            font-family: 'Chunko', sans-serif;
            font-size: 0.85rem;
            color: #F137A6;
            line-height: 1;
            margin-bottom: 1px;
        }

        .mobile-title {
            font-family: 'Chunko', sans-serif;
            font-size: 0.75rem;
            color: #290087;
            margin-bottom: 1px;
            letter-spacing: 0.3px;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mobile-desc {
            font-size: 0.65rem;
            color: #290087;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* COLUMNA DERECHA: Parrilla EPG con Scroll */
        .mobile-right-col {
            flex: 1.3;
            background-color: #120638;
            border: 2px solid #290087;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        /* Cabecera Fucsia EPG */
        .mobile-epg-header {
            display: grid;
            grid-template-columns: 75px repeat(2, 1fr);
            background-color: #F137A6;
            color: #F6FFE9;
            font-family: 'Chunko', sans-serif;
            font-size: 0.75rem;
            text-align: center;
            padding: 4px 0;
            border-bottom: 2px solid #290087;
            flex-shrink: 0;
        }

        .mobile-header-canal {
            border-right: 2px solid #290087;
        }

        /* Contenedor con Scroll para la tabla de canales */
        .mobile-epg-scroll-body {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* Filas de la parrilla */
        .mobile-epg-row {
            display: grid;
            grid-template-columns: 75px 1fr;
            border-bottom: 2px solid #290087;
            min-height: 38px;
        }

        .mobile-epg-row:last-child {
            border-bottom: none;
        }

        .mobile-epg-channel-num {
            background-color: #F2E0A4;
            color: #290087;
            font-family: 'Chunko', sans-serif;
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 2px solid #290087;
        }

        .mobile-epg-subgrid {
            display: grid;
            grid-template-columns: 1fr;
            height: 100%;
        }

        /* Bloques de programas interactivos */
        .mobile-program-block {
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-family: 'Chunko', sans-serif;
            font-size: 0.7rem;
            padding: 2px 4px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .row-yellow-bg {
            background-color: #F2E0A4;
            color: #290087;
        }

        .row-yellow-bg:hover {
            background-color: #F137A6;
            color: #F6FFE9;
        }

        .row-dark-bg {
            background-color: #120638;
            color: #F6FFE9;
        }

        .row-dark-bg:hover {
            background-color: #F137A6;
            color: #F6FFE9;
        }
    </style>
</head>
<body>

    <div class="mobile-tv-container">
        
        <!-- COLUMNA IZQUIERDA: PREVIEW Y DESCRIPCIÓN -->
        <div class="mobile-left-col">
            
            <!-- Video Preview / Pantalla -->
            <div class="mobile-video-preview" id="mobileMediaContainer">
                <a href="index.html" class="btn-regresar-mobile" title="Volver a Inicio">↩</a>
                <video id="mobileVideo" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover;">
                    <source src="videos/ShowreelWbsite.mp4" type="video/mp4">
                </video>
            </div>

            <!-- Tarjeta Info Lavanda -->
            <div class="mobile-info-card">
                <div class="mobile-channel-tag" id="mobChannel">CH 102</div>
                <div class="mobile-title" id="mobTitle">POLY-TV "SHOWREEL"</div>
                <div class="mobile-desc" id="mobDesc">Sintoniza el Showreel principal con lo mejor de tus proyectos y animación 3D.</div>
            </div>

        </div>

        <!-- COLUMNA DERECHA: PARRILLA EPG CON SCROLL -->
        <div class="mobile-right-col">
            <div class="mobile-epg-header">
                <div class="mobile-header-canal">CANAL</div>
                <div>11:00 PM</div>
                <div>11:30 PM</div>
            </div>

            <div class="mobile-epg-scroll-body">
                
                <!-- CH 102 -->
                <div class="mobile-epg-row">
                    <div class="mobile-epg-channel-num">CH 102</div>
                    <div class="mobile-epg-subgrid">
                        <a href="canal.html" class="mobile-program-block row-yellow-bg"
                           ontouchstart="actualizarPreviewMovil('CH 102', 'POLY-TV &quot;SHOWREEL&quot;', 'Sintoniza el Showreel principal con lo mejor de proyectos y animación 3D.', 'video', 'videos/ShowreelWbsite.mp4')"
                           onmouseover="actualizarPreviewMovil('CH 102', 'POLY-TV &quot;SHOWREEL&quot;', 'Sintoniza el Showreel principal con lo mejor de proyectos y animación 3D.', 'video', 'videos/ShowreelWbsite.mp4')">
                            "SHOWREEL"
                        </a>
                    </div>
                </div>

                <!-- CH 50 -->
                <div class="mobile-epg-row">
                    <div class="mobile-epg-channel-num">CH 50</div>
                    <div class="mobile-epg-subgrid">
                        <a href="diseno.html" class="mobile-program-block row-dark-bg"
                           ontouchstart="actualizarPreviewMovil('CH 50', '&quot;CANVAS NETWORK&quot;', 'Explora proyectos de diseño como Tonali, afiches de Estrilda y trifolds.', 'video', 'videos/DISEÑO/Tonali.mp4')"
                           onmouseover="actualizarPreviewMovil('CH 50', '&quot;CANVAS NETWORK&quot;', 'Explora proyectos de diseño como Tonali, afiches de Estrilda y trifolds.', 'video', 'videos/DISEÑO/Tonali.mp4')">
                            "CANVAS NETWORK"
                        </a>
                    </div>
                </div>

                <!-- CH 51 -->
                <div class="mobile-epg-row">
                    <div class="mobile-epg-channel-num">CH 51</div>
                    <div class="mobile-epg-subgrid">
                        <a href="animacion.html" class="mobile-program-block row-dark-bg"
                           ontouchstart="actualizarPreviewMovil('CH 51', '&quot;MOTION-TV&quot;', 'Motion Graphics para la campaña de Estrilda the Bewitched y Maya 3D.', 'video', 'videos/MotionTv/DESN3.mp4')"
                           onmouseover="actualizarPreviewMovil('CH 51', '&quot;MOTION-TV&quot;', 'Motion Graphics para la campaña de Estrilda the Bewitched y Maya 3D.', 'video', 'videos/MotionTv/DESN3.mp4')">
                            "MOTION-TV"
                        </a>
                    </div>
                </div>

                <!-- CH 52 -->
                <div class="mobile-epg-row">
                    <div class="mobile-epg-channel-num">CH 52</div>
                    <div class="mobile-epg-subgrid">
                        <a href="ilustracion.html" class="mobile-program-block row-dark-bg"
                           ontouchstart="actualizarPreviewMovil('CH 52', '&quot;SKETCH BOX&quot;', 'Galería de Concept Art, Diseño de Personajes y Fondos 2D.', 'imagen', 'img/ilustracion/proyecto1.jpg')"
                           onmouseover="actualizarPreviewMovil('CH 52', '&quot;SKETCH BOX&quot;', 'Galería de Concept Art, Diseño de Personajes y Fondos 2D.', 'imagen', 'img/ilustracion/proyecto1.jpg')">
                            "SKETCH BOX"
                        </a>
                    </div>
                </div>

                <!-- CH 53 -->
                <div class="mobile-epg-row">
                    <div class="mobile-epg-channel-num">CH 53</div>
                    <div class="mobile-epg-subgrid">
                        <a href="otros.html" class="mobile-program-block row-dark-bg"
                           ontouchstart="actualizarPreviewMovil('CH 53', '&quot;PIXEL VISION&quot;', 'Proyectos de Desarrollo de Videojuegos, UI/UX y Prototipos.', 'video', 'videos/otros/videojuegos_demo.mp4')"
                           onmouseover="actualizarPreviewMovil('CH 53', '&quot;PIXEL VISION&quot;', 'Proyectos de Desarrollo de Videojuegos, UI/UX y Prototipos.', 'video', 'videos/otros/videojuegos_demo.mp4')">
                            "PIXEL VISION"
                        </a>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Script para actualizar la vista previa al tocar los canales en móvil -->
    <script>
        function actualizarPreviewMovil(canal, titulo, descripcion, tipoMedia, rutaMedia) {
            document.getElementById('mobChannel').innerText = canal;
            document.getElementById('mobTitle').innerHTML = titulo;
            document.getElementById('mobDesc').innerText = descripcion;

            const mediaContainer = document.getElementById('mobileMediaContainer');
            const botonRegresar = '<a href="index.html" class="btn-regresar-mobile" title="Volver a Inicio">↩</a>';

            if (tipoMedia === 'video') {
                mediaContainer.innerHTML = botonRegresar +
                    `<video autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover;">
                        <source src="${rutaMedia}" type="video/mp4">
                    </video>`;
            } else if (tipoMedia === 'imagen') {
                mediaContainer.innerHTML = botonRegresar +
                    `<img src="${rutaMedia}" alt="Preview" style="width:100%; height:100%; object-fit:contain;" onerror="this.src='img/natalie_bio.jpg'">`;
            }
        }
    </script>
</body>
</html>
