<style>
        /* Declaración de Tus Fuentes Originales */
        @font-face {
            font-family: 'Chunko';
            src: url('fonts/Chunko Bold Demo.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Teko';
            src: url('fonts/Teko-Regular.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background-color: #000;
            color: #F6FFE9;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Teko', sans-serif;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Contenedor principal a pantalla completa absoluta sin espacios negros */
        .mobile-tv-container {
            width: 100vw;
            height: 100vh;
            background-color: #290087;
            border: 4px solid #F137A6;
            outline: 2px solid #F2E0A4;
            padding: 4px;
            display: flex;
            gap: 6px;
            box-sizing: border-box;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* COLUMNA IZQUIERDA: Video arriba, Tarjeta Lavanda abajo */
        .mobile-left-col {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            height: 100%;
            overflow: hidden;
        }

        /* Preview Video del canal (Arriba) */
        .mobile-video-preview {
            flex: 1;
            background-color: #000;
            border: 2px solid #F2E0A4;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        .mobile-video-preview video,
        .mobile-video-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Botón regresar dentro del video */
        .btn-regresar-mobile {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            background: rgba(41, 0, 135, 0.7);
            border: 2px solid #F2E0A4;
            border-radius: 4px;
            color: #F6FFE9;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            z-index: 20;
            font-size: 0.75rem;
        }

        /* Tarjeta de Información Lavanda (Abajo - Dividida en dos columnas internas) */
        .mobile-info-card {
            height: 30%;
            background-color: #CAC5E5;
            border: 2px solid #F2E0A4;
            border-radius: 4px;
            padding: 5px 8px;
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .info-left-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .mobile-channel-tag {
            font-family: 'Chunko', sans-serif;
            font-size: 1.1rem;
            color: #F137A6;
            line-height: 1;
            margin-bottom: 1px;
        }

        .mobile-title {
            font-family: 'Chunko', sans-serif;
            font-size: 0.9rem;
            color: #290087;
            letter-spacing: 0.3px;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mobile-desc {
            font-size: 0.68rem;
            color: #290087;
            line-height: 1.05;
            max-height: 2.2em;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        /* COLUMNA DERECHA: Parrilla EPG Compacta */
        .mobile-right-col {
            flex: 1.3;
            background-color: #120638;
            border: 2px solid #290087;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        /* Cabecera Fucsia EPG */
        .mobile-epg-header {
            display: grid;
            grid-template-columns: 75px repeat(2, 1fr);
            background-color: #F137A6;
            color: #F6FFE9;
            font-family: 'Chunko', sans-serif;
            font-size: 0.75rem;
            text-align: center;
            padding: 4px 0;
            border-bottom: 2px solid #290087;
            flex-shrink: 0;
        }

        .mobile-header-canal {
            border-right: 2px solid #290087;
        }

        /* Cuerpo de la tabla para compactar los canales en pantalla */
        .mobile-epg-scroll-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Filas de la parrilla */
        .mobile-epg-row {
            display: grid;
            grid-template-columns: 75px 1fr;
            flex: 1;
            border-bottom: 2px solid #290087;
            min-height: 0;
        }

        .mobile-epg-row:last-child {
            border-bottom: none;
        }

        .mobile-epg-channel-num {
            background-color: #F2E0A4;
            color: #290087;
            font-family: 'Chunko', sans-serif;
            font-size: 0.95rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 2px solid #290087;
        }

        .mobile-epg-subgrid {
            display: grid;
            grid-template-columns: 1fr;
            height: 100%;
        }

        /* Bloques de programas interactivos */
        .mobile-program-block {
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-family: 'Chunko', sans-serif;
            font-size: 0.75rem;
            padding: 2px 4px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
            height: 100%;
        }

        .row-yellow-bg {
            background-color: #F2E0A4;
            color: #290087;
        }

        .row-yellow-bg:hover {
            background-color: #F137A6;
            color: #F6FFE9;
        }

        .row-dark-bg {
            background-color: #120638;
            color: #F6FFE9;
        }

        .row-dark-bg:hover {
            background-color: #F137A6;
            color: #F6FFE9;
        }
    </style>
