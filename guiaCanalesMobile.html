<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guía de Canales - Móvil</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Tus estilos personalizados o de tu portafolio -->
    <style>
        body {
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
            margin: 0;
            padding: 10px;
            font-family: sans-serif;
        }

        /* Contenedor general en dos columnas (Izquierda: TV y Descripcion | Derecha: Guía de canales) */
        .mobile-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            gap: 12px;
            padding: 5px;
        }

        /* Columna Izquierda: TV arriba, Info abajo */
        .left-column {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Caja del video preview del canal (Estilo televisor) */
        .tv-preview-box {
            background-color: #111;
            border: 3px solid #ffde59; /* El borde amarillo de tu boceto */
            border-radius: 8px;
            height: 58%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .tv-preview-box video, 
        .tv-preview-box iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Caja de información del canal activo abajo */
        .channel-info-box {
            background-color: #1a0b2e;
            border: 2px solid #ffde59;
            border-radius: 8px;
            height: 38%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Columna Derecha: Tabla/Parrilla de canales estilo EPG */
        .right-column {
            flex: 1.2;
            background-color: #1a0b2e;
            border: 3px solid #ffde59;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 95vh;
        }

        /* Estilo de la tabla de programación de la derecha */
        .epg-table-mobile {
            width: 100%;
            font-size: 0.8rem;
            border-collapse: collapse;
        }

        .epg-table-mobile th, .epg-table-mobile td {
            border: 1px solid #ff007f; /* Líneas rosadas de tu boceto */
            padding: 6px;
            text-align: center;
        }

        .epg-header {
            background-color: #ff007f;
            color: #fff;
            font-weight: bold;
        }

        .channel-cell {
            background-color: #8b008b;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .program-cell {
            background-color: #2b104a;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }

        .program-cell:hover, .channel-cell:hover {
            background-color: #ffde59;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="mobile-layout">
        
        <!-- COLUMNA IZQUIERDA: TV Y DESCRIPCIÓN -->
        <div class="left-column">
            <!-- Video Preview / Pantalla TV -->
            <div class="tv-preview-box" id="tvPreviewContainer">
                <span style="color: #ffde59; font-weight: bold; font-size: 0.9rem;">Video preview del canal</span>
                <!-- Aquí puedes poner tu etiqueta <video> o <iframe> predeterminada -->
            </div>

            <!-- Caja de descripción del canal actual -->
            <div class="channel-info-box">
                <h6 id="mobileChannelTitle" style="color: #ffde59; margin: 0 0 5ðipx 0; font-size: 0.9rem;">CH 102 - SHOWREEL</h6>
                <p id="mobileChannelDesc" style="margin: 0; font-size: 0.75rem; color: #ddd;">
                    Selecciona un bloque en la guía para sintonizar los proyectos.
                </p>
            </div>
        </div>

        <!-- COLUMNA DERECHA: PARRILLA DE CANALES (EPG) -->
        <div class="right-column">
            <table class="epg-table-mobile">
                <thead>
                    <tr class="epg-header">
                        <th>Canal</th>
                        <th>11:00 PM</th>
                        <th>11:30 PM</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="channel-cell" onclick="sintonizarCanal('102', 'Poly-TV Showreel', 'Showreel general de animación 2D y 3D.')">CH 102</td>
                        <td class="program-cell" colspan="2" onclick="sintonizarCanal('102', 'Poly-TV Showreel', 'Showreel general de animación 2D y 3D.')">"SHOWREEL"</td>
                    </tr>
                    <tr>
                        <td class="channel-cell" onclick="sintonizarCanal('50', 'Canvas Network', 'Red de arte interactivo y desarrollo web.')">CH 50</td>
                        <td class="program-cell" colspan="2" onclick="sintonizarCanal('50', 'Canvas Network', 'Red de arte interactivo y desarrollo web.')">"CANVAS NETWORK"</td>
                    </tr>
                    <tr>
                        <td class="channel-cell" onclick="sintonizarCanal('51', 'Motion-TV', 'Motion graphics y animaciones avanzadas.')">CH 51</td>
                        <td class="program-cell" colspan="2" onclick="sintonizarCanal('51', 'Motion-TV', 'Motion graphics y animaciones avanzadas.')">"MOTION-TV"</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Script de interacción simple para cambiar la vista previa al tocar un canal -->
    <script>
        function sintonizarCanal(numero, titulo, descripcion) {
            document.getElementById('mobileChannelTitle').innerText = `CH ${numero} - ${titulo}`;
            document.getElementById('mobileChannelDesc').innerText = descripcion;
            
            // Aquí puedes actualizar dinámicamente el video o contenido de la pantalla izquierda si lo deseas
            console.log(`Sintonizado canal ${numero}: ${titulo}`);
        }
    </script>
</body>
</html>
