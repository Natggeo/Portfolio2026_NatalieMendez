<!DOCTYPE html>
<html lang="es">
<head>
    
    <link rel="stylesheet" href="estilos-pantallas.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gy Arts - Inicio</title>
    
    <style>
        /* Declaración de la fuente principal */
        @font-face {
            font-family: 'Chunko';
            src: url('fonts/Chunko Bold Demo.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video de fondo a pantalla completa */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Capa de tinte azul retro sobre el video */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(41, 0, 135, 0.4);
            z-index: 2;
        }

        /* Botón principal de Sintonizar */
        .btn-sintonizar {
            position: relative;
            z-index: 3;
            background-color: #F137A6;
            color: #F6FFE9;
            font-family: 'Chunko', sans-serif;
            font-size: 2.2rem;
            padding: 15px 40px;
            border: 4px solid #F2E0A4;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(241, 55, 166, 0.8), 5px 5px 0px #290087;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-sintonizar:hover {
            background-color: #F2E0A4;
            color: #290087;
            transform: scale(1.08);
            border-color: #F137A6;
        }
    </style>
</head>
<body>

    <!-- Video de fondo en bucle -->
    <video autoplay loop muted playsinline class="video-background">
        <source src="videos/portadafinal.mp4" type="video/mp4">
        Tu navegador no soporta el elemento de video.
    </video>
    
    <div class="overlay"></div>

    <!-- Botón que envía a la Guía EPG manteniendo el parámetro -->
    <a href="guiaCanales.html?desde_home=true" class="btn-sintonizar">SINTONIZAR</a>

  <script src="solo-movil.js"></script>

</body>
</html>
